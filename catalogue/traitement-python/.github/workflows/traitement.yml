name: traitement

# Exécution planifiée du traitement : chaque lundi à 6 h (UTC), ou à la demande (onglet Actions →
# traitement → Run workflow). Le fichier nettoyé et le rapport sont joints à l'exécution
# (« Artifacts »), conservés 30 jours. Pour changer la fréquence : demander à un développeur.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traitement:
    name: Traitement planifié
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m traitement
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultat-du-traitement
          path: |
            rapport/
            donnees/sortie/
          retention-days: 30
