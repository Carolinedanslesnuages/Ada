# Construction de l'image sur Cloud Pi Native (DSO), quand le dépôt y est copié en miroir.
# GitHub ne lit pas ce fichier ; les contrôles du projet restent dans .github/workflows/.
# Une image par étiquette de version (ex. 1.2.0), poussée dans le registre du projet DSO.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/
      when: always

default:
  image: alpine:latest

include:
  - project: $CATALOG_PATH
    file:
      - vault-ci.yml
      - kaniko-ci.yml
    ref: main

stages:
  - read-secret
  - docker-build

read_secret:
  stage: read-secret
  extends: .vault:read_secret

docker-build:
  stage: docker-build
  extends: .kaniko:build-push
  variables:
    WORKING_DIR: .
    DOCKERFILE: Dockerfile
    IMAGE_NAMES: ${CI_PROJECT_NAME}:${CI_COMMIT_REF_NAME}
    EXTRA_BUILD_ARGS: --build-arg VERSION=${CI_COMMIT_REF_NAME} --build-arg COMMIT=${CI_COMMIT_SHA}
