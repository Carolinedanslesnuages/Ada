# En développement : « docker compose up -d db » lance la base seule (l'API tourne
# sur le poste). « docker compose up -d --build » lance tout, avec l'image de production :
# API sur http://localhost:8000 (documentation : /api/docs).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: __SLUG__
      POSTGRES_PASSWORD: __SLUG__
      POSTGRES_DB: __SLUG__
    ports:
      - "5432:5432"
    volumes:
      - donnees-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-}
    environment:
      DATABASE_URL: postgresql://__SLUG__:__SLUG__@db:5432/__SLUG__
    # Les migrations d'abord, puis l'API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  donnees-db:
