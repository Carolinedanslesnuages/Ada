name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest

  image:
    name: Image et chart (construction, helm lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image de production, lancée avec la base
        run: VERSION="$(cat version.txt)" COMMIT="$GITHUB_SHA" docker compose up -d --build --wait
      - name: L'API répond
        run: curl -sf http://localhost:8000/api
      - name: Journaux des conteneurs (en cas d'échec)
        if: failure()
        run: docker compose logs
      - name: Chart Helm (si le projet est déployé)
        if: hashFiles('charts/app/Chart.yaml') != ''
        run: |
          curl -sSfL -o helm.tgz https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz
          echo "e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          ./linux-amd64/helm lint --strict charts/app
          ./linux-amd64/helm template verification charts/app --set ingress.enabled=true --set ingress.host=exemple.gouv.fr > /dev/null
