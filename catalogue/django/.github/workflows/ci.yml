name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Migrations à jour (aucun modèle modifié sans migration)
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  accessibilite:
    name: Accessibilité RGAA (pages construites)
    # Ubuntu 24.04 : le Playwright d'Emmanuelle ne prend pas encore en charge Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      # Pages rendues par le serveur : l'application tourne le temps de la vérification.
      - name: Application lancée
        run: |
          python manage.py migrate --verbosity 0
          python manage.py runserver 8000 > /dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/ > /dev/null && exit 0; sleep 1; done
          exit 1
      # Lien d'évitement, focus visible, 320 px, zoom, espacement du texte, axe-core : chaque constat
      # rangé par critère du RGAA. Défauts connus et justifiés : .emmanuelle-reference.json.
      - uses: Carolinedanslesnuages/emmanuelle@dd6ac2e0319b7f8b13c61d1af6b2c810dee0f485 # v1.1.0
        with:
          url: http://localhost:8000
          pages: "/ /admin/login/"
