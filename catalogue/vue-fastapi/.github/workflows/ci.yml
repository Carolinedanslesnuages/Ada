name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest

  front:
    name: Front (lint, types, tests dont accessibilité, compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx oxlint .
      - run: npx eslint .
      - run: npm run type-check
      - run: npm run test:unit -- --run
      - run: npm run build-only

  image:
    name: Image et chart (construction, helm lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Images de production (api/Dockerfile, front/Dockerfile), lancées avec la base
        run: VERSION="$(cat version.txt)" COMMIT="$GITHUB_SHA" docker compose up -d --build --wait
      - name: Le front répond et transmet /api à l'API
        run: |
          curl -sf http://localhost:8080/ > /dev/null
          curl -sf http://localhost:8080/api
      - name: Journaux des conteneurs (en cas d'échec)
        if: failure()
        run: docker compose logs
      - name: Chart Helm (si le projet est déployé)
        if: hashFiles('charts/app/Chart.yaml') != ''
        run: |
          curl -sSfL -o helm.tgz https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz
          echo "e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          ./linux-amd64/helm lint --strict charts/app
          ./linux-amd64/helm template verification charts/app --set ingress.enabled=true --set ingress.host=exemple.gouv.fr > /dev/null

  accessibilite:
    name: Accessibilité RGAA (pages construites)
    # Ubuntu 24.04 : le Playwright d'Emmanuelle ne prend pas encore en charge Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npm run build-only
        working-directory: front
      # Lien d'évitement, focus visible, 320 px, zoom, espacement du texte, axe-core : chaque constat
      # rangé par critère du RGAA. Défauts connus et justifiés : .emmanuelle-reference.json.
      - uses: Carolinedanslesnuages/emmanuelle@dd6ac2e0319b7f8b13c61d1af6b2c810dee0f485 # v1.1.0
        with:
          dossier: front/dist
          pages: "/"
          # Application monopage : chaque adresse de la liste reçoit index.html, comme chez l'hébergeur.
          monopage: "true"
