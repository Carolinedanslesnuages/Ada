apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.nomComplet" . }}-front
  labels:
    {{- include "app.etiquettes" . | nindent 4 }}
    app.kubernetes.io/component: front
spec:
  replicas: {{ .Values.front.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selecteurs" . | nindent 6 }}
      app.kubernetes.io/component: front
  template:
    metadata:
      labels:
        {{- include "app.etiquettes" . | nindent 8 }}
        app.kubernetes.io/component: front
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      # Pas d'utilisateur fixé : Kubernetes prend celui de l'image, OpenShift attribue le sien.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: front
          image: "{{ .Values.front.image.repository }}:{{ .Values.front.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.front.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # nginx transmet /api à l'API, par son service interne.
            - name: ADRESSE_API
              value: "http://{{ include "app.nomComplet" . }}-api:8000"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.front.resources | nindent 12 }}
          volumeMounts:
            # Système de fichiers en lecture seule : nginx écrit sa configuration et ses fichiers
            # temporaires dans ces deux dossiers.
            - name: configuration
              mountPath: /etc/nginx/conf.d
            - name: temporaire
              mountPath: /tmp
      volumes:
        - name: configuration
          emptyDir: {}
        - name: temporaire
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
