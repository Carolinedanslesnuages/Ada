[project]
# Nom fixe : uv l'écrit dans uv.lock. Le nom du projet est dans PROJET.md et app/main.py.
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
# Versions exactes ; « uv add <paquet>==<version> » ajoute une dépendance et met uv.lock à jour.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.1",
    "pydantic-settings==2.16.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[tool.ruff]
# Réglages des conventions de la Fabrique numérique (lint et formattage), plus S et RUF.
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Erreurs, style, imports, noms (pep8-naming), bonnes pratiques, compréhensions, simplifications,
# sécurité de base.
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = [
    "E501",  # longueur de ligne : gérée par le formateur
    "S101",  # assert : autorisé dans les tests
]
# Typographie française voulue (apostrophe, guillemets, espaces insécables).
allowed-confusables = ["’", "«", "»", "\u00a0", "\u202f"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Starlette conseille httpx2 pour le client de test ; trop récent pour l'instant (moins de deux
# semaines) : httpx est gardé, l'avertissement est connu.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
