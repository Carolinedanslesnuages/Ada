name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, tests, compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  image:
    name: Image et chart (construction, helm lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image de production, lancée avec la base
        run: VERSION="$(cat version.txt)" COMMIT="$GITHUB_SHA" docker compose up -d --build --wait
      - name: L'API répond
        run: curl -sf http://localhost:3000/api
      - name: Journaux des conteneurs (en cas d'échec)
        if: failure()
        run: docker compose logs
      - name: Chart Helm (si le projet est déployé)
        if: hashFiles('helm/Chart.yaml') != ''
        run: |
          curl -sSfL -o helm.tgz https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz
          echo "e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          ./linux-amd64/helm lint --strict helm
          ./linux-amd64/helm template verification helm --set ingress.enabled=true --set ingress.host=exemple.gouv.fr > /dev/null
