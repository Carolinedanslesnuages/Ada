apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.nomComplet" . }}-front
  labels:
    {{- include "app.etiquettes" . | nindent 4 }}
    app.kubernetes.io/component: front
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "app.selecteurs" . | nindent 4 }}
    app.kubernetes.io/component: front
---
# L'API n'est jointe que par le front (nginx lui transmet /api) : jamais exposée directement.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.nomComplet" . }}-api
  labels:
    {{- include "app.etiquettes" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- include "app.selecteurs" . | nindent 4 }}
    app.kubernetes.io/component: api
