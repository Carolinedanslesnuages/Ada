# En développement : « docker compose up -d db » lance la base seule (l'API et le front tournent
# sur le poste). « docker compose up -d --build » lance tout, avec les images de production :
# front sur http://localhost:8080, qui transmet /api à l'API.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: __SLUG__
      POSTGRES_PASSWORD: __SLUG__
      POSTGRES_DB: __SLUG__
    ports:
      - "5432:5432"
    volumes:
      - donnees-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-}
    environment:
      DATABASE_URL: postgresql://__SLUG__:__SLUG__@db:5432/__SLUG__?schema=public
    # Les migrations d'abord (s'il y en a), puis l'API.
    command: sh -c "if [ -d prisma/migrations ]; then npx prisma migrate deploy; fi && node dist/main"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  front:
    build:
      context: ./front
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  donnees-db:
