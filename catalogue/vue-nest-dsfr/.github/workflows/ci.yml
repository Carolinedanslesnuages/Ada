name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, tests, compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm, à la version inscrite dans api/package.json (« packageManager »).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: api/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

  front:
    name: Front (lint, types, tests dont accessibilité, compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm, à la version inscrite dans front/package.json (« packageManager »).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:unit --run
      - run: pnpm build-only

  image:
    name: Image et chart (construction, helm lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Images de production (api/Dockerfile, front/Dockerfile), lancées avec la base
        run: VERSION="$(cat version.txt)" COMMIT="$GITHUB_SHA" docker compose up -d --build --wait
      - name: Le front répond et transmet /api à l'API
        run: |
          curl -sf http://localhost:8080/ > /dev/null
          curl -sf http://localhost:8080/api
      - name: Journaux des conteneurs (en cas d'échec)
        if: failure()
        run: docker compose logs
      - name: Chart Helm (si le projet est déployé)
        if: hashFiles('helm/Chart.yaml') != ''
        run: |
          curl -sSfL -o helm.tgz https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz
          echo "e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          ./linux-amd64/helm lint --strict helm
          ./linux-amd64/helm template verification helm --set ingress.enabled=true --set ingress.host=exemple.gouv.fr > /dev/null

  accessibilite:
    name: Accessibilité RGAA (pages construites)
    # Ubuntu 24.04 : le Playwright d'Emmanuelle ne prend pas encore en charge Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm, à la version inscrite dans front/package.json (« packageManager »).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: front
      - run: pnpm build-only
        working-directory: front
      # Lien d'évitement, focus visible, 320 px, zoom, espacement du texte, axe-core : chaque constat
      # rangé par critère du RGAA. Défauts connus et justifiés : .emmanuelle-reference.json.
      - uses: Carolinedanslesnuages/emmanuelle@dd6ac2e0319b7f8b13c61d1af6b2c810dee0f485 # v1.1.0
        with:
          dossier: front/dist
          pages: "/"
          # Application monopage : chaque adresse de la liste reçoit index.html, comme chez l'hébergeur.
          monopage: "true"
