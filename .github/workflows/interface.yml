name: interface

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: interface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Interface — API (lint, tests, compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  front:
    name: Interface — Front (lint, types, tests dont accessibilité, compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface/front
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/front/package-lock.json
      - run: npm ci
      - run: npx oxlint .
      - run: npx eslint .
      - run: npm run type-check
      - run: npm run test:unit -- --run
      - run: npm run build-only

  accessibilite:
    name: Interface — Accessibilité RGAA (pages construites)
    # Ubuntu 24.04 : le Playwright d'Emmanuelle ne prend pas encore en charge Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/front/package-lock.json
      - run: npm ci
        working-directory: interface/front
      - run: npm run build-only
        working-directory: interface/front
      # Front construit, servi comme pour une personne non connectée (l'API répond 401).
      - name: Front servi sans session
        run: |
          node interface/front/scripts/servir-sans-session.mjs 4173 > /dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0; sleep 1; done
          exit 1
      - uses: Carolinedanslesnuages/emmanuelle@dd6ac2e0319b7f8b13c61d1af6b2c810dee0f485 # v1.1.0
        with:
          url: http://127.0.0.1:4173
          pages: "/connexion"
