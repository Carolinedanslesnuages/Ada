name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    name: Skills conformes (invariants agent-skills)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Conformité des SKILL.md (invariants d'ADA)
        run: node scripts/verifier-skills.mjs
      - name: Format Agent Skills, sécurité et qualité des skills (Olympe)
        uses: Carolinedanslesnuages/olympe@e850607e6b09a98df9035578e464d1ad33599644 # v1.0.0
        with:
          chemins: skills/po
          strict: "true"
          max-lignes: "100"
      - name: Catalogues index.json à jour (node scripts/skills-index.mjs pour les régénérer)
        run: node scripts/skills-index.mjs --check
      - name: Référentiel RGAA à jour (node scripts/rgaa-generer.mjs pour le régénérer)
        run: |
          node scripts/rgaa-generer.mjs ressources/rgaa/4.1.2/criteres.json "$RUNNER_TEMP/rgaa" 4.1.2
          diff -r "$RUNNER_TEMP/rgaa" skills/po/po-story/references/rgaa-4.1.2
      - name: Versions par le workflow commun fabnum-cicd, épinglé à un SHA, identique dans ADA et le socle des modèles
        run: |
          grep -Eq 'uses: dnum-mi/fabnum-cicd/\.github/workflows/release-app\.yml@[0-9a-f]{40} # v[0-9.]+$' .github/workflows/release-please.yml
          diff -u .github/workflows/release-please.yml catalogue/socle/.github/workflows/release-please.yml
      - name: Contrôles communs des projets (Constance et Madeleine, épinglées à un SHA), exigés par chaque modèle
        run: |
          for workflow in titre-pr taille-fichiers anti-fuite dependances; do
            grep -Eq 'uses: Carolinedanslesnuages/(constance/[a-z-]+|madeleine)@[0-9a-f]{40} # v[0-9.]+$' "catalogue/socle/.github/workflows/$workflow.yml" \
              || { echo "catalogue/socle/.github/workflows/$workflow.yml : l'action doit être épinglée à un SHA"; exit 1; }
          done
          for modele in catalogue/*/; do
            [ "$modele" = catalogue/socle/ ] && continue
            for controle in 'Anti-fuite (gitleaks)' 'Dépendances (paquet réel, version exacte, licence)' 'Titre de PR (Conventional Commits, semver)' 'Taille des fichiers (une responsabilité par fichier)'; do
              grep -qF "\"$controle\"" "$modele/ada.json" || { echo "contrôle « $controle » non exigé dans $modele/ada.json"; exit 1; }
            done
          done
      - name: Accessibilité des pages construites (Emmanuelle, épinglée à un SHA), exigée là où elle tourne
        run: |
          for ci in catalogue/*/.github/workflows/ci.yml; do
            modele=${ci%/.github/workflows/ci.yml}
            grep -q 'Carolinedanslesnuages/emmanuelle' "$ci" || continue
            grep -Eq 'uses: Carolinedanslesnuages/emmanuelle@[0-9a-f]{40} # v[0-9.]+$' "$ci" || { echo "$ci : Emmanuelle doit être épinglée à un SHA"; exit 1; }
            grep -qF '"Accessibilité RGAA (pages construites)"' "$modele/ada.json" || { echo "contrôle d'accessibilité non exigé dans $modele/ada.json"; exit 1; }
          done
      - name: Contrôles communs identiques dans ADA et le socle des projets
        run: |
          for workflow in titre-pr taille-fichiers anti-fuite dependances; do
            diff -u ".github/workflows/$workflow.yml" "catalogue/socle/.github/workflows/$workflow.yml"
          done
          diff -u madeleine.json catalogue/socle/madeleine.json
      - name: Référentiel RGAA du socle identique à celui de la skill po-story
        run: diff -r skills/po/po-story/references/rgaa-4.1.2 catalogue/socle/ressources/accessibilite/rgaa-4.1.2
      - name: Liens .claude/skills et .agents/skills vers chaque skill
        run: |
          for s in skills/po/*/; do
            n=$(basename "$s")
            test -f ".claude/skills/$n/SKILL.md" || { echo "lien manquant .claude/skills/$n"; exit 1; }
            test -f ".agents/skills/$n/SKILL.md" || { echo "lien manquant .agents/skills/$n"; exit 1; }
          done

  images:
    name: Image et chart du modèle ${{ matrix.modele }} (construction, démarrage, helm lint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modele: [vue-node, formulaire]
    defaults:
      run:
        working-directory: catalogue/${{ matrix.modele }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image de production
        run: docker build -t modele .
      - name: L'image démarre et répond
        run: |
          docker run -d --name modele -p 8080:8080 modele
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/api && exit 0; sleep 1; done
          docker logs modele; exit 1
      - name: Chart Helm, personnalisé comme à la création d'un projet
        run: |
          curl -sSfL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz
          echo "e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          cp -R charts/app "$RUNNER_TEMP/app"
          sed -i 's/__SLUG__/projet-essai/g; s/__NOM_PROJET__/Projet essai/g' "$RUNNER_TEMP/app/Chart.yaml" "$RUNNER_TEMP/app/values.yaml"
          "$RUNNER_TEMP/linux-amd64/helm" lint --strict "$RUNNER_TEMP/app"
          "$RUNNER_TEMP/linux-amd64/helm" template essai "$RUNNER_TEMP/app" --set ingress.enabled=true --set ingress.host=exemple.gouv.fr > /dev/null

  modeles:
    name: Modèle ${{ matrix.modele }} (installation, lint, types, tests, compilation)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modele: [vue-nest-dsfr, vue-node, vue-node-sans-dsfr, vue-fastapi, formulaire, tableau-de-bord, api-nest, api-fastapi, traitement-python, django, vitepress, nuxt, carte, quiz, composant, pwa, extension, maquette]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Contrôles déclarés par catalogue/${{ matrix.modele }}/ada.json
        run: node scripts/verifier-modele.mjs "${{ matrix.modele }}"
